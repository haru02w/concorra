# Local development services. Production compose comes later (see docs/SPEC.md §7).
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concorra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concorra}
      POSTGRES_DB: ${POSTGRES_DB:-concorra}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-concorra}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-concorra-secret}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  rustfs-data:

# Production stack for the single self-hosted server (docs/SPEC.md §7).
# TLS/routing is done by the existing reverse proxy: point it at 127.0.0.1:3000 (web)
# and, for presigned downloads, at 127.0.0.1:9000 (RustFS S3 API, set S3_PUBLIC_ENDPOINT).
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d --build

x-app: &app
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-concorra}:${POSTGRES_PASSWORD:-concorra}@postgres:5432/${POSTGRES_DB:-concorra}
    S3_ENDPOINT: http://rustfs:9000
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rustfs:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concorra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concorra}
      POSTGRES_DB: ${POSTGRES_DB:-concorra}
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB", "-c", "max_connections=60"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data
    mem_limit: 512m
    restart: unless-stopped

  migrate:
    <<: *app
    build: { context: ., target: migrate }
    restart: "no"

  web:
    <<: *app
    build: { context: ., target: web }
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g

  worker:
    <<: *app
    build: { context: ., target: worker }
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 2500m

volumes:
  postgres-data:
  rustfs-data:
